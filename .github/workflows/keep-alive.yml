name: Supabase keep alive

# Interroge la base Supabase tous les 3 jours pour empecher
# la mise en pause automatique du projet (offre gratuite : pause apres 7 jours sans activite).

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requete sur la base
        env:
          SUPABASE_URL: https://xonxwhdswzvooqqfptbn.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Reponse Supabase : $status"
          if [ "$status" -ge 400 ]; then
            echo "Echec du ping"
            exit 1
          fi
